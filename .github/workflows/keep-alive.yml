# Supabase無料プランの自動休止(1週間動きがないと停止)を防ぐため、毎日2回、実際にDBを読む関数を呼ぶ。
# Secrets: SUPABASE_URL(例: https://xxxx.supabase.co)
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0,12 * * *' # UTC 00:00 / 12:00 = JST 09:00 / 21:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health-check function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::SUPABASE_URL が未設定のためスキップしました(設定後に自動で動きます)"
            exit 0
          fi
          curl -sf -X POST "$SUPABASE_URL/functions/v1/health-check" -o /dev/null -w "status=%{http_code}\n"
